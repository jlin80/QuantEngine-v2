# Grafana — provisión automática de dashboards (Fase 9).
# Los JSON viven en /var/lib/grafana/dashboards (montado desde docker/grafana/dashboards).
apiVersion: 1
providers:
  - name: "Quant Engine"
    orgId: 1
    folder: "Quant Engine"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
