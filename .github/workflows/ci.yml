# ============================================================================
# CI (Fase 9) — calidad + build de imágenes. NO despliega a producción: el
# despliegue es una decisión humana (la regla de oro de la fase). El build de
# imágenes valida que los Dockerfiles construyen, pero nunca hace push ni deploy.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (formato)
        run: black --check .

      - name: MyPy (tipos)
        run: mypy

      - name: Pytest (unit + integración, con cobertura)
        env:
          QE_ENVIRONMENT: testing
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker-build:
    name: Build de imágenes (sin push)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: quant-engine-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard.Dockerfile
          push: false
          tags: quant-engine-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # El despliegue a producción NO es automático: requiere aprobación explícita
  # del operador y superar el Live Gate. Se añadirá como job manual
  # (workflow_dispatch + environment protegido) cuando exista destino de producción.
